<div class="container">
  <header class="d-flex justify-content-between align-items-center py-3 mb-4 border-bottom flex-wrap gap-2">
    <ul class="nav nav-pills">
      <li class="nav-item">
        <a routerLink="home" class="nav-link" routerLinkActive="active" aria-current="page">Home</a>
      </li>
      <li class="nav-item">
        <a routerLink="orders" class="nav-link" routerLinkActive="active">Orders</a>
      </li>
      <li class="nav-item">
        <a routerLink="products" class="nav-link" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }">Products</a>
      </li>
      <li class="nav-item">
        <a routerLink="products/add" class="nav-link" routerLinkActive="active">Add product</a>
      </li>
      <li class="nav-item">
        <a routerLink="testimonials" class="nav-link" routerLinkActive="active">Testimonials</a>
      </li>
      <li class="nav-item">                                                          
        <a routerLink="report" class="nav-link" routerLinkActive="active">Report</a>
      </li>
      <li class="nav-item">
        <a routerLink="notifications" class="nav-link" routerLinkActive="active">
          🔔 Notifications
          @if (unreadCount$ | async; as count) {
            <span class="badge rounded-pill bg-danger ms-1">{{ count }}</span>
          }
        </a>
      </li>
    </ul>

    <button type="button" class="btn btn-brand btn-sm" (click)="logout()">Logout</button>
  </header>
</div>
