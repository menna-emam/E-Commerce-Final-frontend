
<div class="product-card h-100 d-flex flex-column">
  <a [routerLink]="['/products', product.slug]" class="image-wrap d-block position-relative">
    <img
      [src]="imgBase + product.imgURL"
      [alt]="product.name"
      [class.sold-out]="!product.isInStock"
      loading="lazy"
      decoding="async"
    />
    @if (!product.isInStock) {
      <span class="tag tag-dark">Out of Stock</span>
    } @else if (product.isLowStock) {
      <span class="tag tag-red">Only {{ product.stock }} left</span>
    }
  </a>
  <div class="info pt-3 d-flex flex-column flex-grow-1">
    <small class="category text-uppercase">{{ product.category.name }}</small>
    <h6 class="name mb-1">{{ product.name }}</h6>
    <p class="price mb-3">{{ product.price }} EGP</p>
    <div class="actions mt-auto d-flex gap-2">
      <a [routerLink]="['/products', product.slug]" class="btn btn-brand btn-sm flex-grow-1">
        View Details
      </a>
      <button
        class="btn btn-outline-dark btn-sm"
        [disabled]="!product.isInStock"
        (click)="addToCart()"
      >
        {{ justAdded ? 'Added ✓' : 'Add to Cart' }}
      </button>
    </div>
  </div>
</div>
